run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - revive
    - gosec
    - bodyclose
    - noctx
    - nilerr
    - contextcheck
issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
