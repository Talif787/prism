{{- if .Values.devInfra.enabled }}
{{- $root := . -}}
{{- $full := include "prism.fullname" . -}}
# In-cluster development infrastructure. Ephemeral and single-replica. Not for
# production: no persistence, no HA, no tuning. Use managed data services instead.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prism.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "prism.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.devInfra.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: prism
            - name: POSTGRES_PASSWORD
              value: prism
            - name: POSTGRES_DB
              value: prism
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "prism"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "prism.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-clickhouse
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prism.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        {{- include "prism.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.devInfra.clickhouse.image }}
          env:
            - name: CLICKHOUSE_DB
              value: prism
            - name: CLICKHOUSE_USER
              value: prism
            - name: CLICKHOUSE_PASSWORD
              value: prism
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-clickhouse
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  selector:
    {{- include "prism.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: native
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-redis
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prism.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "prism.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.devInfra.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-redis
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "prism.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-redpanda
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prism.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: redpanda
  template:
    metadata:
      labels:
        {{- include "prism.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: redpanda
    spec:
      containers:
        - name: redpanda
          image: {{ .Values.devInfra.redpanda.image }}
          # Use args, not command: the redpanda image entrypoint hands these to
          # "rpk redpanda start", which is what interprets --mode=dev-container.
          # Overriding command would bypass the entrypoint and pass the flags to the
          # raw broker binary, which rejects them. This mirrors the compose command.
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --default-log-level=warn
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://{{ $full }}-redpanda:9092
          ports:
            - name: kafka
              containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-redpanda
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  selector:
    {{- include "prism.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-jaeger
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prism.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        {{- include "prism.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.devInfra.jaeger.image }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: ui
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-jaeger
  labels:
    {{- include "prism.labels" $root | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  selector:
    {{- include "prism.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: ui
      port: 16686
      targetPort: ui
{{- end }}
