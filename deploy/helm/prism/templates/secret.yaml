apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prism.fullname" . }}-secret
  labels:
    {{- include "prism.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default (printf "postgres://prism:prism@%s-postgres:5432/prism?sslmode=disable" (include "prism.fullname" .)) | quote }}
  INTERNAL_API_TOKEN: {{ .Values.secrets.internalApiToken | quote }}
  AUTH_DEV_HS256_SECRET: {{ .Values.secrets.authDevSecret | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
